[package]
name = "tessera"
version = "0.1.0"
authors = ["Sven Brettschneider"]
edition = "2024"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["canvas", "image", "svg", "tokio"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Only to read an image's size; the same version iced decodes with.
image = { version = "0.25", default-features = false }
rayon = "1.12.0"
# Rasterises the SVG export for the PNG export; the version iced uses.
resvg = { version = "0.45", default-features = false }
# The file format: a zip of the drawing (JSON) and its background images.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Geometry and rendering are far too slow unoptimised; keep our own code
# quick to build but optimise it a little, and dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Only to draw the canvas in benchmarks, with the renderer the app uses
# (on a GPU without a window); the same iced as above.
[dev-dependencies]
iced_renderer = { git = "https://github.com/iced-rs/iced", branch = "master" }
iced_wgpu = { git = "https://github.com/iced-rs/iced", branch = "master" }
