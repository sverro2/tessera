[package]
name = "tessera"
version = "0.1.0"
authors = ["Sven Brettschneider"]
edition = "2024"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["canvas", "image", "svg", "tokio"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Only to read an image's size; the same version iced decodes with.
image = { version = "0.25", default-features = false }
rayon = "1.12.0"

# Geometry and rendering are far too slow unoptimised; keep our own code
# quick to build but optimise it a little, and dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
